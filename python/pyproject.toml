[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uivault"
version = "3.0.0"
description = "UI Vault design themes for Python UIs: Qt, Tkinter, Textual, GTK4, Dear PyGui, matplotlib, Rich."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ui", "theme", "qt", "tkinter", "textual", "gtk", "dearpygui", "design-system"]

[project.urls]
Homepage = "https://thenameiscobmarley.github.io/ui-vault/code.html"
Source = "https://github.com/thenameiscobmarley/ui-vault"

[tool.setuptools]
packages = ["uivault"]

[tool.setuptools.package-data]
uivault = ["tokens.json"]
