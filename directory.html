<style>
  :root { --pg-bg: #121211; --pg-bg2: #181817; --pg-bg3: #222220; --pg-fg: #ecebe8; --pg-mu: #a19d95; --pg-di: #8f8a82; --pg-ln: #ffffff1a; --pg-ln2: #ffffff26; --pg-ac: #ff6a26; --pg-font: "Geist", system-ui, sans-serif; --pg-head: "Instrument Serif", serif; }
  html[data-theme="light"] { --pg-bg: #f4f2ee; --pg-bg2: #fbfaf8; --pg-bg3: #ffffff; --pg-fg: #1a1917; --pg-mu: #5f5b54; --pg-di: #8f8a82; --pg-ln: #1a19171a; --pg-ln2: #1a19172e; --pg-ac: #ff4f00; }
  html[data-uv-theme] { --pg-bg: var(--uv-bg); --pg-bg2: var(--uv-surface); --pg-bg3: var(--uv-surface-2); --pg-fg: var(--uv-text); --pg-mu: var(--uv-muted); --pg-di: var(--uv-dim); --pg-ln: var(--uv-line); --pg-ln2: var(--uv-line-2); --pg-ac: var(--uv-accent); --pg-font: var(--uv-font); --pg-head: var(--uv-font-head); }
  body { margin: 0; background: var(--pg-bg); color: var(--pg-fg); font-family: var(--pg-font); }
  html[data-uv-bg] body { background: transparent; }
  .top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; height: 58px; padding: 0 clamp(16px, 3vw, 32px); background: var(--pg-bg); border-bottom: 1px solid var(--pg-ln); }
  .top .brand { display: flex; align-items: center; gap: 10px; color: var(--pg-fg); text-decoration: none; font-weight: 600; }
  .top .brand svg rect { fill: var(--pg-fg); } .top .brand svg path { stroke: var(--pg-bg); } .top .brand svg circle { fill: var(--pg-ac); }
  .top nav { margin-left: auto; display: flex; gap: 2px; } .top nav a { padding: 6px 10px; border-radius: 6px; color: var(--pg-mu); text-decoration: none; font-size: 14px; transition: color .15s, background-color .15s; } .top nav a:hover, .top nav a[aria-current] { color: var(--pg-fg); background: var(--pg-ln); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); }
  .k { font: 500 12px "Geist Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--pg-di); }
  .hero { padding: 56px 0 18px; }
  .hero h1 { margin: 8px 0 0; font: 400 clamp(56px, 9vw, 120px)/.9 var(--pg-head); letter-spacing: -.03em; } .hero h1 em { color: var(--pg-ac); }
  .sbox { position: sticky; top: 58px; z-index: 40; padding: 14px 0 10px; background: var(--pg-bg); }
  .sbox label { position: relative; display: block; }
  .sbox input { width: 100%; box-sizing: border-box; height: 64px; padding: 0 120px 0 56px; border-radius: 12px; border: 1px solid var(--pg-ln2); background: var(--pg-bg2); color: var(--pg-fg); font: 22px var(--pg-font); outline: none; transition: border-color .2s, box-shadow .2s; }
  .sbox input:focus { border-color: var(--pg-ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pg-ac) 18%, transparent); }
  .sbox svg { position: absolute; left: 20px; top: 50%; translate: 0 -50%; color: var(--pg-di); }
  .sbox kbd { position: absolute; right: 16px; top: 50%; translate: 0 -50%; font: 12px "Geist Mono", monospace; color: var(--pg-di); border: 1px solid var(--pg-ln2); border-radius: 4px; padding: 3px 7px; }
  .chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); padding-right: 40px; }
  .chips button { flex: none; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--pg-ln2); background: none; color: var(--pg-mu); font: 500 13px var(--pg-font); cursor: pointer; transition: color .15s, border-color .15s, background-color .15s; } .chips button:hover { color: var(--pg-fg); border-color: var(--pg-mu); background: var(--pg-ln); } .chips button small { opacity: .6; margin-left: 4px; font-family: "Geist Mono", monospace; }
  .chips button.on { background: var(--pg-fg); color: var(--pg-bg); border-color: var(--pg-fg); }
  .res { list-style: none; margin: 8px 0 0; padding: 0; }
  .res li { border-bottom: 1px solid var(--pg-ln); }
  .res li a { display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: center; margin: 2px 0; padding: 10px 12px; border-radius: 8px; color: inherit; text-decoration: none; transition: background-color .15s, box-shadow .15s; }
  .res li.sel a { background: color-mix(in srgb, var(--pg-ac) 9%, var(--pg-bg2)); box-shadow: inset 3px 0 0 var(--pg-ac); }
  .res li.sel b { color: var(--pg-fg); } .res li.sel .go { color: var(--pg-ac); } .res .go::after { content: " →"; display: inline-block; opacity: 0; translate: -4px 0; transition: opacity .15s, translate .15s; } .res li.sel .go::after { opacity: 1; translate: 0 0; }
  .res li.ext .go::after { content: none; }
  .res .kind { font: 500 11px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .05em; color: var(--pg-di); }
  .res .kind i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; background: var(--c, var(--pg-ac)); }
  .res b { font-weight: 600; } .res mark { background: color-mix(in srgb, var(--pg-ac) 30%, transparent); color: inherit; border-radius: 2px; }
  .res small { display: block; color: var(--pg-mu); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .go { font: 12px "Geist Mono", monospace; color: var(--pg-di); white-space: nowrap; transition: color .15s; }
  .more { display: block; margin: 14px auto 0; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--pg-ln2); background: none; color: var(--pg-fg); font: 500 13px var(--pg-font); cursor: pointer; transition: background-color .15s, border-color .15s; } .more:hover { background: var(--pg-ln); border-color: var(--pg-mu); }
  .empty { padding: 40px 0; color: var(--pg-mu); text-align: center; }
  .dir { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 18px 0 40px; }
  .grp { border: 1px solid var(--pg-ln); border-radius: 12px; padding: 18px; background: var(--pg-bg2); transition: border-color .2s; } .grp:hover { border-color: var(--pg-ln2); }
  .grp h2 { margin: 0 0 12px; font: 400 32px/1 var(--pg-head); }
  .grp > a { position: relative; display: block; margin: 0 -10px; padding: 10px 34px 10px 10px; border-top: 1px solid var(--pg-ln); border-radius: 8px; color: inherit; text-decoration: none; transition: background-color .15s; }
  .grp > a + a, .grp > .subs + a { margin-top: 2px; }
  .grp > a::after { content: "→"; position: absolute; right: 12px; top: 12px; color: var(--pg-ac); opacity: 0; translate: -6px 0; transition: opacity .15s, translate .15s; }
  .grp > a:hover { background: color-mix(in srgb, var(--pg-ac) 8%, var(--pg-bg3)); border-top-color: transparent; } .grp > a:hover::after { opacity: 1; translate: 0 0; }
  .grp > a b { font-weight: 600; transition: color .15s; } .grp > a:hover b { color: var(--pg-ac); } .grp > a small { display: block; color: var(--pg-mu); font-size: 13px; margin-top: 2px; }
  .grp .subs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; } .grp .subs a { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--pg-ln); font-size: 12px; color: var(--pg-mu); text-decoration: none; transition: color .15s, border-color .15s, background-color .15s; } .grp .subs a:hover { color: var(--pg-fg); border-color: var(--pg-ac); background: color-mix(in srgb, var(--pg-ac) 10%, transparent); }
  .lib { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding: 22px 24px; margin: 18px 0 6px; border-radius: 14px; border: 1px solid var(--pg-ln2); background: linear-gradient(120deg, color-mix(in srgb, var(--pg-ac) 16%, var(--pg-bg2)), var(--pg-bg2) 60%); }
  .lib h2 { margin: 0; font: 400 40px/1 var(--pg-head); } .lib p { margin: 6px 0 0; color: var(--pg-mu); max-width: 560px; }
  .lib a { padding: 12px 18px; border-radius: 8px; background: var(--pg-fg); color: var(--pg-bg); text-decoration: none; font-weight: 600; white-space: nowrap; transition: background-color .2s, color .2s, translate .2s, box-shadow .2s; } .lib a:hover { background: var(--pg-ac); color: var(--uv-on-accent, #fff); translate: 0 -2px; box-shadow: 0 10px 24px -12px var(--pg-ac); }
  .counts { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px; color: var(--pg-mu); font-size: 14px; } .counts b { color: var(--pg-fg); font-size: 20px; margin-right: 4px; }
  :is(a, button, input):focus-visible { outline: 2px solid var(--pg-ac); outline-offset: 2px; } .sbox input:focus-visible { outline: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 640px) { .res li a { grid-template-columns: 1fr; gap: 2px; } .res .go { display: none; } .sbox input { font-size: 18px; height: 56px; } .sbox kbd { display: none; } }
</style>
